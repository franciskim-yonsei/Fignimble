name: Build Windows preview

on:
  push:
    tags: ["windows-preview-*"]

permissions:
  contents: write

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Test reusable SSH with Python 3.10
        shell: pwsh
        run: |
          python -m pip install paramiko==5.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the test SSH server.' }
          python tests/windows_ssh/smoke.py

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test reusable SSH with Python 3.12
        shell: pwsh
        run: |
          python -m pip install paramiko==5.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the test SSH server.' }
          python tests/windows_ssh/smoke.py

      - name: Build the Windows installer and portable ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Fignimble-Windows-x64.zip'
          $setup = Join-Path $env:RUNNER_TEMP 'Fignimble-Windows-x64-Setup.exe'
          $version = (Get-Content VERSION -Raw).Trim() + '-preview.' + ($env:GITHUB_REF_NAME -replace '^windows-preview-', '')
          .\apps\windows\package.ps1 -Output $zip -InstallerOutput $setup -InstallerVersion $version
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $files = $archive.Entries.FullName -replace '\\', '/'
            foreach ($required in @('Fignimble.exe', 'coreclr.dll', 'Renci.SshNet.dll', 'SSH-LICENSES.txt', 'engine/fignimble/rpc.py', 'engine/fignimble/ssh_pipe.py', 'setup-python.ps1')) {
              if ("Fignimble/$required" -notin $files) { throw "Missing from ZIP: $required" }
            }
          } finally {
            $archive.Dispose()
          }
          Get-FileHash -Algorithm SHA256 $zip, $setup

      - name: Test installer, Start menu shortcut and uninstall
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'Fignimble-Windows-x64-Setup.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'Fignimble Test Install'
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$directory`"") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exited with code $($result.ExitCode)." }
          foreach ($required in @('Fignimble.exe', 'coreclr.dll', 'Renci.SshNet.dll', 'engine/fignimble/ssh_pipe.py', 'setup-python.ps1', 'unins000.exe')) {
            if (!(Test-Path (Join-Path $directory $required))) { throw "Missing from installed app: $required" }
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Fignimble.lnk'
          if (!(Test-Path $shortcut)) { throw 'The installer did not create a Start menu shortcut.' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne (Join-Path $directory 'Fignimble.exe')) { throw "Unexpected shortcut target: $target" }
          $result = Start-Process -FilePath (Join-Path $directory 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path $shortcut) -or (Test-Path (Join-Path $directory 'Fignimble.exe'))) {
            throw 'The installer could not cleanly uninstall Fignimble.'
          }

      - name: Upload installer and ZIP to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Create a draft release for this preview tag before building.' }
          $zip = Join-Path $env:RUNNER_TEMP 'Fignimble-Windows-x64.zip'
          $setup = Join-Path $env:RUNNER_TEMP 'Fignimble-Windows-x64-Setup.exe'
          gh release upload $env:GITHUB_REF_NAME $zip $setup --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'The Windows files could not be uploaded.' }
